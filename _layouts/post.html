---
layout: default
---

<article class="mx-auto max-w-7xl bg-[#f0fbff]">
    {% if page.image %}
    <img src="{{ page.image }}" alt="{{ page.title | default: "Entrada" }}" class="h-60 w-full object-cover" loading="lazy" referrerpolicy="no-referrer" onerror="handleImageError(this)">
    {% else %}
    <div class="flex h-full items-center justify-center text-5xl text-[#4bb6e8]"><i class="fas fa-newspaper"></i></div>
    {% endif %}
    <div class="px-14 py-8">
        <div class="mb-4 flex items-center justify-between gap-4 text-sm font-bold text-slate-500">
            <span>{{ page.date | date: "%Y-%m-%d" }}</span>
            <span>{{ page.author | default: "Gambirots" }}</span>
        </div>
        <h3 class="text-2xl font-bold text-[#1d6f9a]">{{ page.title | default: "Entrada" }}</h3>
        <div class="mt-3 pt-0 leading-7 text-slate-600">
            {{ content }}
        </div>
    </div>
</article>
