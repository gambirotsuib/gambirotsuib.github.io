<script>
    function handleImageError(image) {
        const parent = image.parentElement;
        image.removeAttribute('onerror');
        image.style.display = 'none';

        if (!parent || parent.querySelector('.fallback-icon')) {
            return;
        }

        parent.classList.add('fallback-media');
        const icon = document.createElement('span');
        icon.className = 'fallback-icon';
        icon.innerHTML = '<i class="fas fa-people-group"></i>';
        parent.appendChild(icon);
    }

    window.handleImageError = handleImageError;

    function parseCsv(text) {
        const rows = [];
        let current = '';
        let row = [];
        let inQuotes = false;

        for (let i = 0; i < text.length; i += 1) {
            const char = text[i];
            const next = text[i + 1];

            if (char === '"' && inQuotes && next === '"') {
                current += '"';
                i += 1;
            } else if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                row.push(current.trim());
                current = '';
            } else if ((char === '\n' || char === '\r') && !inQuotes) {
                if (char === '\r' && next === '\n') {
                    i += 1;
                }
                row.push(current.trim());
                if (row.some(Boolean)) {
                    rows.push(row);
                }
                current = '';
                row = [];
            } else {
                current += char;
            }
        }

        row.push(current.trim());
        if (row.some(Boolean)) {
            rows.push(row);
        }

        const headers = (rows.shift() || []).map((header) => header.trim());
        return rows.map((values) => headers.reduce((item, header, index) => {
            item[header] = values[index] || '';
            return item;
        }, {}));
    }

    function safeText(value, fallback = '') {
        return value && String(value).trim() ? String(value).trim() : fallback;
    }

    function escapeHtml(value) {
        const span = document.createElement('span');
        span.textContent = safeText(value);
        return span.innerHTML;
    }
    
    function formatDate(dateStr) {
        const date = new Date(dateStr);
        if (Number.isNaN(date.getTime())) {
            return safeText(dateStr, 'Data pendent');
        }

        return date.toLocaleDateString('ca-ES', { day: '2-digit', month: 'short' }).toUpperCase();
    }

    function setActiveButton(buttons, activeButton) {
        buttons.forEach((button) => {
            button.classList.toggle('is-active', button === activeButton);
        });
    }
</script>
